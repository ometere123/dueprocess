name: fix-address-boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize public role address at contract boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('contracts/dueprocess.py')
          text = contract.read_text()
          text = text.replace(
              'def bind_role(self, instance_id: u256, role_id: u256, actor: Address) -> u256: ...',
              'def bind_role(self, instance_id: u256, role_id: u256, actor: str) -> u256: ...',
          )
          text = text.replace(
              '    def bind_role(self, instance_id: u256, role_id: u256, actor: Address) -> u256:\n',
              '    def bind_role(self, instance_id: u256, role_id: u256, actor: str) -> u256:\n',
          )
          old = '''        if actor == ZERO_ADDRESS:\n            raise gl.vm.UserError(f"{ERR_EXPECTED}: zero address cannot hold a role")\n        if self._find_binding(instance_id, process, int(role_id)) is not None:\n'''
          new = '''        try:\n            actor_address = Address(str(actor))\n        except Exception:\n            raise gl.vm.UserError(f"{ERR_EXPECTED}: invalid role address")\n        if actor_address == ZERO_ADDRESS:\n            raise gl.vm.UserError(f"{ERR_EXPECTED}: zero address cannot hold a role")\n        if self._find_binding(instance_id, process, int(role_id)) is not None:\n'''
          if old not in text:
              raise SystemExit('expected bind_role validation block not found')
          text = text.replace(old, new, 1)
          old_store = 'RoleBinding(instance_id=instance_id, role_id=role_id, actor=actor)'
          if old_store not in text:
              raise SystemExit('expected RoleBinding store expression not found')
          text = text.replace(old_store, 'RoleBinding(instance_id=instance_id, role_id=role_id, actor=actor_address)', 1)
          contract.write_text(text)

          tests = Path('tests/direct/test_dueprocess.py')
          t = tests.read_text()
          t = t.replace('from genlayer import Address\n\n', '')
          old_helper = '''def as_address(raw):\n    """Direct fixtures are raw 20-byte values; public ABI calls normally coerce them."""\n    if hasattr(raw, "as_bytes"):\n        return raw\n    return Address("0x" + bytes(raw).hex())\n'''
          new_helper = '''def as_address(raw):\n    """Use the same user-facing 0x address string accepted by the public contract ABI."""\n    if isinstance(raw, str):\n        return raw\n    return "0x" + bytes(raw).hex()\n'''
          if old_helper not in t:
              raise SystemExit('expected test address helper not found')
          t = t.replace(old_helper, new_helper, 1)
          tests.write_text(t)
          PY
      - name: Commit boundary fix
        run: |
          if git diff --quiet -- contracts/dueprocess.py tests/direct/test_dueprocess.py; then
            echo 'nothing to patch'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/dueprocess.py tests/direct/test_dueprocess.py
          git commit -m 'fix: normalize role addresses at public boundary'
          git push
