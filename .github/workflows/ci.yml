name: contract-ci

on:
  push:
  pull_request:

jobs:
  direct-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-direct.txt
      - run: genvm-lint check contracts/dueprocess.py
      - run: genvm-lint check contracts/protected_executor.py
      - run: pytest tests/direct -v
      - run: python scripts/preflight.py

  studio-dev-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: genvm-lint check contracts/dueprocess.py
      - run: genvm-lint check contracts/protected_executor.py
      - run: python -m py_compile tests/integration/test_studionet_lifecycle.py scripts/check_studio_dev.py
      - run: python scripts/preflight.py
