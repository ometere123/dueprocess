name: contract-ci

on:
  push:
  pull_request:

jobs:
  direct-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-direct.txt
      - run: python scripts/check_lint_compat.py contracts/dueprocess.py contracts/protected_executor.py
      - name: Run pinned Direct Mode suite
        run: |
          cp gltest.direct.config.yaml gltest.config.yaml
          pytest tests/direct -v
          git restore gltest.config.yaml
      - run: python scripts/preflight.py

  studio-dev-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: python scripts/check_lint_compat.py contracts/dueprocess.py contracts/protected_executor.py
      - run: python -m py_compile tests/integration/test_studionet_lifecycle.py scripts/check_studio_dev.py
      - run: python scripts/preflight.py
