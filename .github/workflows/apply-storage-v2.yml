name: apply-storage-v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace DueProcess with storage-safe indexed model
        run: |
          python - <<'PY'
          from pathlib import Path
          import zlib, base64
          payload = """"""
          Path('contracts/dueprocess.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/dueprocess.py
          if git diff --cached --quiet; then
            echo "No replacement needed"
            exit 0
          fi
          git commit -m "fix: use indexed storage model for Direct Mode compatibility"
          git push
