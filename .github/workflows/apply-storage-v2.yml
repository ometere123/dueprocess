name: apply-storage-v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace nested stored arrays with indexed TreeMaps
        run: |
          python - <<'PY'
          from pathlib import Path
          import zlib, base64
          path = Path('contracts/dueprocess.py')
          current = path.read_text()
          if 'inmem_allocate(DynArray' not in current and 'DynArray[u256]()' not in current:
              print('storage already flattened; nothing to do')
              raise SystemExit(0)
          payload = """
          """
          path.write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
      - name: Commit storage flattening
        run: |
          if git diff --quiet -- contracts/dueprocess.py; then
            echo 'no contract change'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/dueprocess.py
          git commit -m 'fix: flatten stored relation arrays for Direct Mode'
          git push
