name: repair-storage-allocation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch nested storage allocations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contracts/dueprocess.py')
          text = p.read_text()
          old = 'DynArray[u256]()'
          new = 'gl.storage.inmem_allocate(DynArray[u256])'
          if old in text:
              p.write_text(text.replace(old, new))
              print('patched nested DynArray allocations')
          else:
              print('no patch needed')
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No storage allocation patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/dueprocess.py
          git commit -m "fix: allocate nested storage arrays correctly"
          git push
