name: repair-direct-sdk

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/direct/test_dueprocess.py')
          text = p.read_text()
          text = text.replace('SDK_VERSION = "v0.2.12"', 'SDK_VERSION = "v0.2.16"')
          p.write_text(text)
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/direct/test_dueprocess.py
          git commit -m "test: use current v0.2 runner for Direct Mode"
          git push
